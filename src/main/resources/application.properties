spring.application.name=duesync
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/duesync;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

duesync.admin-key=${DUESYNC_ADMIN_KEY}
duesync.upload-dir=./uploads
duesync.default-dues-amount=5000
duesync.cors-origins=${DUESYNC_CORS_ORIGINS:http://localhost:5173}
